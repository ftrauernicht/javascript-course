<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Calculator</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="calculator">
    <div id="display" class="display">0</div>

    <div class="buttons">
      <button data-action="clear" class="button button--wide">C</button>
      <button data-operator="/" class="button button--operator">÷</button>
      <button data-operator="*" class="button button--operator">×</button>

      <button data-digit="7" class="button">7</button>
      <button data-digit="8" class="button">8</button>
      <button data-digit="9" class="button">9</button>
      <button data-operator="-" class="button button--operator">−</button>

      <button data-digit="4" class="button">4</button>
      <button data-digit="5" class="button">5</button>
      <button data-digit="6" class="button">6</button>
      <button data-operator="+" class="button button--operator">+</button>

      <button data-digit="1" class="button">1</button>
      <button data-digit="2" class="button">2</button>
      <button data-digit="3" class="button">3</button>
      <button data-action="equals" class="button button--equals">=</button>

      <button data-digit="0" class="button button--wide">0</button>
      <button data-digit="." class="button">.</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
