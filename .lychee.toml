# lychee link checker config -- https://lychee.cli.rs
#
# Only markdown files are scanned. Anchors/fragments on external pages (e.g.
# MDN headings) are not verified -- only that each URL and each relative
# file link (chapter cross-links, images) resolves.

extensions = ["md"]
max_retries = 3
retry_wait_time = 5
timeout = 20

# Treat rate-limited responses as passing rather than failing CI -- a 429
# means the host is alive and throttling us, not that the link is dead.
accept = ["200..=299", "429"]

# node_modules (Course 10) is gitignored and full of third-party READMEs
# with their own example/anchor links -- not this repo's content to check.
exclude_path = [
  "node_modules",
]

# npmjs.com sits behind bot protection that blocks GitHub Actions runners
# outright (a browser user agent alone didn't fix it -- confirmed by a
# failing CI run) -- not a dead link, just unreachable from CI.
exclude = [
  '^https://(www\.)?npmjs\.com',
]
